[workspace]
resolver = "2"
members = ["crates/yunshu-core", "crates/pigeonbot", "crates/yunshu-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
