<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>远程控制</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0e; }
    #screen { display: block; width: 100vw; height: 100vh; cursor: default; outline: none; }
    /* 远程软光标活动时隐藏本地光标，避免双指针 */
    #screen.remote-cursor { cursor: none; }
    .overlay {
      position: fixed; top: 10px; right: 12px; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; border-radius: 999px;
      background: rgba(10, 14, 13, 0.72); color: #e7ece9;
      font: 12px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      backdrop-filter: blur(6px); user-select: none;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .dot.off { background: #ef4444; }
    .overlay button, .overlay select {
      border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
      background: rgba(255,255,255,0.08); color: inherit;
      font: inherit; padding: 2px 10px; cursor: pointer;
    }
    .overlay button:hover { background: rgba(255,255,255,0.16); }
    .overlay button.danger { border-color: rgba(255,90,100,0.5); color: #ff8a93; }
    .hint {
      position: fixed; bottom: 10px; left: 12px; z-index: 10;
      color: rgba(231, 236, 233, 0.45); font: 11px/1.6 -apple-system, "PingFang SC", sans-serif;
      user-select: none; pointer-events: none;
    }
    .mask {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      background: rgba(8, 10, 9, 0.85); color: #e7ece9;
      font: 14px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    .mask.show { display: flex; }
    .spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15); border-top-color: #22c55e;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="screen" tabindex="0"></canvas>
  <div class="overlay" id="overlay" style="display:none">
    <span class="dot" id="dot"></span>
    <span id="status">连接中…</span>
    <select id="monitor" title="显示器" style="display:none"></select>
    <select id="quality" title="画质">
      <option value="720">流畅</option>
      <option value="1080">高清</option>
      <option value="1920" selected>超清</option>
    </select>
    <button id="sendfile" title="向对方电脑传文件（也可直接拖文件进窗口）">传文件</button>
    <button id="fullscreen" title="全屏（F11 也可）">全屏</button>
    <button class="danger" id="disconnect">断开</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="mask show" id="mask"><div class="spinner" id="spinner"></div><div id="maskText">正在连接远程控制…</div></div>
  <script type="module" src="/src/viewer.js"></script>
</body>
</html>
