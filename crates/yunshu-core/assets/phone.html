<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>云书</title>
<style>
  :root {
    --accent: #1e88e5; --accent-dark: #1565c0; --accent-light: #e3f0fb;
    --bg: #f5f7fa; --card: #ffffff; --text: #2c3e50; --muted: #8a99a8;
    --ok: #2ea05b; --wait: #f5a623; --err: #e53935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .page { max-width: 560px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---- 顶栏 ---- */
  header { background: var(--card); padding: 10px 14px; display: flex; align-items: center; gap: 10px;
           box-shadow: 0 1px 4px rgba(0,0,0,.06); z-index: 5; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
            position: relative; flex: none; }
  .avatar::after { content: ""; position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px;
                   border-radius: 50%; background: var(--ok); border: 2px solid #fff; }
  header .meta { flex: 1; min-width: 0; }
  header .meta b { font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .meta span { font-size: 12px; color: var(--muted); }
  header .meta span.online { color: var(--ok); }

  /* ---- 聊天时间线 ---- */
  #chat { flex: 1; overflow-y: auto; padding: 14px 12px 10px; }
  .meta { font-size: 11px; color: var(--muted); margin: 10px 4px 4px; }
  .meta.right { text-align: right; }
  .row { display: flex; margin-bottom: 10px; }
  .row.right { justify-content: flex-end; }
  .row > * { max-width: 82%; }

  .bubble { background: var(--card); border-radius: 14px; padding: 10px 12px; font-size: 15px;
            word-break: break-all; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .bubble.mine { background: var(--accent-light); }

  .card { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .card .title-row { display: flex; align-items: center; gap: 8px; }
  .file-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-light); color: var(--accent);
             display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .card .title-row b { font-size: 15px; word-break: break-all; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; flex: none; }
  .badge.wait { background: #fdf3e0; color: var(--wait); }
  .badge.run  { background: var(--accent-light); color: var(--accent); }
  .badge.done { background: #e6f4ea; color: var(--ok); }
  .badge.err  { background: #fdecea; color: var(--err); }
  .progress { height: 5px; background: #e8edf3; border-radius: 3px; overflow: hidden; margin-top: 9px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .card .body { border-top: 1px solid #eef1f5; margin-top: 10px; padding-top: 10px; font-size: 14px; }
  .card textarea { width: 100%; border: none; resize: none; font-size: 14px; color: var(--text); background: transparent; outline: none; }
  .act { display: flex; align-items: center; gap: 6px; border-top: 1px solid #eef1f5; margin-top: 10px; padding-top: 10px;
         color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; }
  .status-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 9px; }
  .spin { width: 13px; height: 13px; border: 2px solid #dde4ec; border-top-color: var(--accent); border-radius: 50%;
          animation: r 1s linear infinite; flex: none; }
  @keyframes r { to { transform: rotate(360deg); } }

  /* ---- 输入条 ---- */
  footer { background: var(--card); padding: 9px 12px; display: flex; gap: 9px; align-items: center;
           box-shadow: 0 -1px 4px rgba(0,0,0,.05); }
  .round-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #eef2f7; color: var(--text);
               font-size: 20px; flex: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .round-btn.accent { background: var(--accent); color: #fff; font-size: 17px; }
  #text-in { flex: 1; border: none; background: #eef2f7; border-radius: 21px; padding: 11px 16px; font-size: 15px; outline: none; }

  /* ---- 连接/配对页 ---- */
  .center-card { margin: auto 16px; background: var(--card); border-radius: 16px; padding: 24px 18px;
                 box-shadow: 0 2px 10px rgba(0,0,0,.08); text-align: center; }
  .logo { font-size: 26px; font-weight: 700; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  input.code { text-align: center; font-size: 26px; letter-spacing: 10px; font-weight: 600; margin: 16px 0 12px; }
  input.name { margin-bottom: 12px; }
  button.primary { width: 100%; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600;
                   background: var(--accent); color: #fff; cursor: pointer; }
  button.primary:active { opacity: .85; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .big-spin { width: 34px; height: 34px; border: 3px solid #dde4ec; border-top-color: var(--accent); border-radius: 50%;
              margin: 20px auto 12px; animation: r 1s linear infinite; }
</style>
</head>
<body>

<!-- 连接中 -->
<div id="page-connecting" class="page">
  <div class="center-card">
    <div class="logo">云书</div>
    <div class="big-spin"></div>
    <p class="sub" id="conn-text">正在连接电脑…</p>
    <button class="primary hidden" id="btn-reload" onclick="location.reload()">重新扫码</button>
  </div>
</div>

<!-- 配对 -->
<div id="page-pairing" class="page">
  <div class="center-card">
    <div class="logo">云书</div>
    <p class="sub">电脑上已显示 6 位配对码<br>请输入完成配对</p>
    <input class="code" id="code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
    <input class="name" id="device-name" maxlength="20" placeholder="设备名称">
    <button class="primary" id="btn-pair">确认配对</button>
    <p class="err" id="pair-err"></p>
  </div>
</div>

<!-- 主界面：聊天时间线 -->
<div id="page-main" class="page hidden">
  <header>
    <div class="avatar" id="pc-avatar">云</div>
    <div class="meta">
      <b id="pc-name">电脑</b>
      <span id="pc-status">连接中…</span>
    </div>
  </header>
  <div id="chat"></div>
  <footer>
    <button class="round-btn" id="btn-file">＋</button>
    <input id="text-in" placeholder="发送消息…" autocomplete="off">
    <button class="round-btn accent" id="btn-send">➤</button>
  </footer>
</div>

<input type="file" id="file-input" multiple hidden>

<script>
const $ = id => document.getElementById(id);
let ws = null, paired = false, retryTimer = null, tokenDead = false;
let session = '';
try { session = sessionStorage.getItem('ys-session') || ''; } catch (_) {}
const token = new URLSearchParams(location.search).get('t') || '';
let pcName = '电脑';

function storeSession(v) { try { sessionStorage.setItem('ys-session', v); } catch (_) {} }
function storeDevice(v) { try { localStorage.setItem('ys-device', v); } catch (_) {} }

function deviceName() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad/i.test(ua)) return 'iPhone';
  if (/Android/i.test(ua)) return 'Android 手机';
  if (/HarmonyOS/i.test(ua)) return '鸿蒙手机';
  return '手机浏览器';
}
try { $('device-name').value = localStorage.getItem('ys-device') || deviceName(); }
catch (_) { $('device-name').value = deviceName(); }

function show(page) {
  for (const p of ['connecting', 'pairing', 'main'])
    $('page-' + p).classList.toggle('hidden', p !== page);
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function now() { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

/* ---------- 连接 ---------- */
function connect() {
  if (ws || tokenDead) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  try { ws = new WebSocket(proto + '://' + location.host + '/ws'); }
  catch (_) { ws = null; scheduleRetry(); return; }
  ws.onopen = () => {
    stopRetry();
    show('pairing');
    send({ type: 'hello', token: token, device: $('device-name').value.trim() || deviceName() });
  };
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (_) {} };
  ws.onclose = () => {
    ws = null;
    if (!paired) {
      show('connecting');
      $('conn-text').textContent = '连接断开，正在重连…';
      scheduleRetry();
    } else {
      setPcOnline(false);
    }
  };
  ws.onerror = () => {};
}
function scheduleRetry() {
  if (retryTimer || paired || tokenDead) return;
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, 2000);
}
function stopRetry() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
}

function setPcOnline(online) {
  const s = $('pc-status');
  s.textContent = online ? `${location.host} · 在线` : `${location.host} · 已断开`;
  s.classList.toggle('online', online);
}

function handle(m) {
  switch (m.type) {
    case 'pair_result':
      if (m.ok) {
        paired = true;
        session = m.session;
        storeSession(session);
        pcName = m.pc_name || '电脑';
        $('pc-name').textContent = pcName;
        $('pc-avatar').textContent = (pcName[0] || '云').toUpperCase();
        setPcOnline(true);
        show('main');
      } else {
        $('pair-err').textContent = m.reason || '配对失败';
        if ((m.reason || '').indexOf('过期') >= 0) {
          tokenDead = true;
          stopRetry();
          show('connecting');
          $('conn-text').textContent = '二维码已过期，请重新扫码';
          $('btn-reload').classList.remove('hidden');
        } else if ((m.reason || '').indexOf('超时') >= 0) {
          $('code').value = '';
          send({ type: 'hello', token: token, device: $('device-name').value.trim() || deviceName() });
        }
      }
      break;
    case 'pc_text': addInText(m.text); break;
    case 'pc_file': addInFile(m); break;
    case 'progress': updateProgress(m); break;
  }
}

/* ---------- 时间线渲染 ---------- */
function el(tag, cls, text) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text != null) d.textContent = text;
  return d;
}
function addMeta(dir, label) {
  const meta = el('div', 'meta' + (dir === 'right' ? ' right' : ''), label);
  $('chat').appendChild(meta);
  scrollBottom();
}
function scrollBottom() { requestAnimationFrame(() => { $('chat').scrollTop = $('chat').scrollHeight; }); }

function addOutText(text) {
  addMeta('right', '我 ' + now());
  const row = el('div', 'row right');
  row.appendChild(el('div', 'bubble mine', text));
  $('chat').appendChild(row);
  scrollBottom();
}
function addInText(text) {
  addMeta('left', pcName + ' ' + now());
  const row = el('div', 'row');
  const card = el('div', 'card');
  const ta = el('textarea');
  ta.readOnly = true; ta.value = text; ta.rows = Math.min(6, text.split('\n').length);
  const body = el('div', 'body');
  body.appendChild(ta);
  const act = el('div', 'act', '⧉ 复制到剪贴板');
  act.onclick = () => {
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    document.execCommand('copy');
    act.textContent = '✓ 已复制';
  };
  card.append(body, act);
  row.appendChild(card);
  $('chat').appendChild(row);
  scrollBottom();
}
function addOutFile(name, size) {
  addMeta('right', '我 ' + now());
  const row = el('div', 'row right');
  const card = el('div', 'card');
  card.style.width = '240px';
  const tr = el('div', 'title-row');
  tr.append(el('div', 'file-ic', '📄'));
  const tw = el('div');
  tw.style.flex = '1'; tw.style.minWidth = '0';
  tw.appendChild(el('b', null, name));
  tw.appendChild(el('div', 'sub', `→ ${pcName} · ${fmtSize(size)}`));
  tr.appendChild(tw);
  const badge = el('span', 'badge run', '传输中');
  tr.appendChild(badge);
  card.appendChild(tr);
  const bar = el('i');
  const p = el('div', 'progress');
  p.appendChild(bar);
  card.appendChild(p);
  row.appendChild(card);
  $('chat').appendChild(row);
  scrollBottom();
  return {
    setProgress: (loaded, total) => { bar.style.width = (total ? loaded / total * 100 : 0) + '%'; },
    setStatus: (t, cls) => { badge.textContent = t; badge.className = 'badge ' + cls; card.removeChild(p); }
  };
}
function addInFile(m) {
  addMeta('left', pcName + ' ' + now());
  const row = el('div', 'row');
  const card = el('div', 'card');
  card.style.width = '240px';
  const tr = el('div', 'title-row');
  tr.append(el('div', 'file-ic', '📄'));
  const tw = el('div');
  tw.style.flex = '1'; tw.style.minWidth = '0';
  tw.appendChild(el('b', null, m.name));
  tw.appendChild(el('div', 'sub', fmtSize(m.size)));
  tr.appendChild(tw);
  card.appendChild(tr);
  const a = el('a', null, '⬇ 下载到手机');
  a.style.cssText = 'display:flex;align-items:center;gap:6px;border-top:1px solid #eef1f5;margin-top:10px;padding-top:10px;color:var(--accent);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer';
  a.href = '/file/' + m.id + '?s=' + encodeURIComponent(session);
  a.setAttribute('download', m.name);
  card.appendChild(a);
  row.appendChild(card);
  $('chat').appendChild(row);
  scrollBottom();
}
function updateProgress(m) {
  const bar = document.getElementById('pb-' + m.id);
  if (bar) bar.style.width = (m.size ? m.transferred / m.size * 100 : 0) + '%';
}

/* ---------- 发送 ---------- */
$('btn-send').onclick = sendText;
$('text-in').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
function sendText() {
  const text = $('text-in').value.trim();
  if (!text) return;
  send({ type: 'send_text', text: text });
  addOutText(text);
  $('text-in').value = '';
}
$('btn-file').onclick = () => $('file-input').click();
$('file-input').onchange = () => {
  for (const f of [...$('file-input').files]) uploadFile(f);
  $('file-input').value = '';
};
function uploadFile(f) {
  const fd = new FormData();
  fd.append('file', f);
  const xhr = new XMLHttpRequest();
  const card = addOutFile(f.name, f.size);
  xhr.open('POST', '/upload?s=' + encodeURIComponent(session));
  xhr.upload.onprogress = e => card.setProgress(e.loaded, e.total);
  xhr.onload = () => {
    card.setProgress(1, 1);
    if (xhr.status === 200) card.setStatus('已发送', 'done');
    else {
      let msg = '失败';
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
      card.setStatus(msg, 'err');
    }
  };
  xhr.onerror = () => card.setStatus('失败', 'err');
  xhr.send(fd);
}

/* ---------- 配对 ---------- */
$('btn-pair').onclick = () => {
  const code = $('code').value.trim();
  if (!/^\d{6}$/.test(code)) { $('pair-err').textContent = '请输入 6 位数字配对码'; return; }
  const name = $('device-name').value.trim() || deviceName();
  storeDevice(name);
  $('pair-err').textContent = '';
  send({ type: 'pair', code: code });
};
$('device-name').onchange = () => {
  const name = $('device-name').value.trim() || deviceName();
  storeDevice(name);
  send({ type: 'hello', token: token, device: name });
};

connect();
</script>
</body>
</html>
