<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>云书</title>
<style>
  :root {
    --brand1: #2f6bff; --brand2: #4f8cff;
    --bg: #eef2f8; --card: #ffffff; --card-2: #f4f7fb;
    --text: #1c2430; --muted: #7c8794; --line: #e8edf4;
    --ok: #23a55a; --wait: #d98a0b; --err: #e5484d;
    --mine-1: #3572ff; --mine-2: #5b8cff;
    --shadow: 0 10px 30px rgba(28, 46, 84, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand1: #4d7dff; --brand2: #6f97ff;
      --bg: #0e131d; --card: #171e2c; --card-2: #1e2736;
      --text: #e8edf4; --muted: #8b96a5; --line: #26303f;
      --mine-1: #2f5fd0; --mine-2: #4a7ae8;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; /* 应用式页面：滚动全部收在内部容器，杜绝整页滚动条 */
  }
  .page {
    max-width: 560px; margin: 0 auto;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .hidden { display: none !important; }
  svg.ic { width: 1em; height: 1em; display: block; flex: none; }

  /* ---- 引导页（连接中 / 配对）公共：品牌区 + 卡片 ---- */
  /* auto margin 居中：空间充足时垂直居中，空间不足（矮视口/键盘弹出）时容器内滚动而非溢出 body */
  .gate { flex: 1; display: flex; flex-direction: column; align-items: center;
          overflow-y: auto;
          padding: max(24px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom)); }
  .gate-inner { margin: auto 0; width: 100%; }
  .brand-hero { text-align: center; margin-bottom: 26px; }
  .brand-hero h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; margin-top: 14px;
                   background: linear-gradient(120deg, var(--brand1), var(--brand2));
                   -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-hero p { font-size: 13px; color: var(--muted); margin-top: 8px; letter-spacing: .3px; }
  .envelope { width: 96px; height: 96px; margin: 0 auto; display: block;
              filter: drop-shadow(0 10px 18px rgba(47, 107, 255, .25));
              animation: float 4.5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .gate-card { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 22px;
               padding: 24px 20px 20px; box-shadow: var(--shadow); }
  .gate-card .headline { font-size: 17px; font-weight: 700; text-align: center; }
  .gate-card .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; line-height: 1.5; }

  .peer-line { display: flex; align-items: center; justify-content: center; gap: 7px;
               font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .peer-line .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none;
                    box-shadow: 0 0 0 3px rgba(35, 165, 90, .18); }

  /* ---- 6 格配对码 ---- */
  .otp { display: flex; gap: 8px; justify-content: center; margin: 20px 0 4px; }
  .otp input {
    width: 46px; height: 58px; text-align: center; font-size: 24px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--text);
    background: var(--card-2); border: 1.5px solid var(--line); border-radius: 14px;
    outline: none; caret-color: var(--brand1); transition: border-color .15s, background .15s, transform .15s;
  }
  .otp input:focus { border-color: var(--brand1); background: var(--card); transform: translateY(-2px);
                     box-shadow: 0 4px 12px rgba(47, 107, 255, .18); }
  .otp input.filled { border-color: transparent; background: var(--card-2); }
  .otp.shake { animation: shake .4s; }
  .otp.bad input { border-color: var(--err); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); }
                     40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .code-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }

  .field { width: 100%; margin-top: 14px; background: var(--card-2); border: 1.5px solid var(--line);
           border-radius: 14px; padding: 12px 14px; font-size: 15px; color: var(--text); outline: none;
           transition: border-color .15s; }
  .field:focus { border-color: var(--brand1); }
  .field-label { font-size: 12px; color: var(--muted); margin-top: 16px; display: block; }

  button.primary {
    width: 100%; border: none; border-radius: 15px; margin-top: 18px;
    padding: 14px; font-size: 16px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(135deg, var(--brand1), var(--brand2)); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 6px 16px rgba(47, 107, 255, .30);
    transition: transform .12s, box-shadow .12s, opacity .15s;
  }
  button.primary:active { transform: scale(.97); box-shadow: 0 3px 10px rgba(47, 107, 255, .25); }
  button.primary:disabled { opacity: .65; box-shadow: none; }
  .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
          border-radius: 50%; animation: rot 1s linear infinite; flex: none; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .form-err { color: var(--err); font-size: 13px; text-align: center; min-height: 19px; margin-top: 10px; }
  .safe-note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 18px;
               display: flex; align-items: center; justify-content: center; gap: 5px; }
  .safe-note svg.ic { font-size: 13px; color: var(--ok); }

  .big-spin { width: 38px; height: 38px; border: 3.5px solid var(--line); border-top-color: var(--brand1);
              border-radius: 50%; margin: 26px auto 14px; animation: rot 1s linear infinite; }

  /* ---- 主界面 ---- */
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 11px; z-index: 5;
  }
  .avatar { width: 42px; height: 42px; border-radius: 13px; color: #fff; font-size: 17px; font-weight: 700;
            background: linear-gradient(135deg, var(--brand1), var(--brand2));
            display: flex; align-items: center; justify-content: center; flex: none; }
  header .meta { flex: 1; min-width: 0; }
  header .meta b { font-size: 16px; font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .meta span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  header .meta span.online { color: var(--ok); }
  header .meta span .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

  #chat { flex: 1; overflow-y: auto; padding: 16px 14px 12px; overscroll-behavior: contain; }
  #chat:empty::before {
    content: "电脑发来的消息和文件会出现在这里"; display: block;
    text-align: center; color: var(--muted); font-size: 13px; margin-top: 38vh;
  }
  .ts { text-align: center; font-size: 11px; color: var(--muted); margin: 14px 0 6px; }
  .ts:first-child { margin-top: 2px; }
  .row { display: flex; margin: 3px 0; animation: pop .22s ease-out; }
  .row.right { justify-content: flex-end; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .row > * { max-width: 84%; }

  .bubble {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 15px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
  }
  .bubble.mine { background: linear-gradient(135deg, var(--mine-1), var(--mine-2)); border: none;
                 color: #fff; border-radius: 18px 18px 6px 18px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; }
  .card.mine { background: var(--card); border-color: rgba(47, 107, 255, .35); }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .file-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
             justify-content: center; font-size: 19px; flex: none; color: #fff; }
  .title-row .tw { flex: 1; min-width: 0; }
  .title-row b { font-size: 14.5px; display: block; word-break: break-all; line-height: 1.4; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; flex: none; font-weight: 600; }
  .badge.wait { background: rgba(217, 138, 11, .14); color: var(--wait); }
  .badge.run  { background: rgba(47, 107, 255, .12); color: var(--brand1); }
  .badge.done { background: rgba(35, 165, 90, .13); color: var(--ok); }
  .badge.err  { background: rgba(229, 72, 77, .12); color: var(--err); }

  .progress-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .progress { flex: 1; height: 7px; background: var(--card-2); border: 1px solid var(--line);
              border-radius: 4px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0;
                background: linear-gradient(90deg, var(--brand1), var(--brand2));
                border-radius: 4px; transition: width .2s; }
  .pct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }

  .act { display: flex; align-items: center; gap: 6px; margin-top: 11px; padding-top: 11px;
         border-top: 1px solid var(--line); color: var(--brand1); font-size: 13.5px; font-weight: 600;
         cursor: pointer; user-select: none; }
  .act svg.ic { font-size: 15px; }
  .act:active { opacity: .6; }

  .wx-guide { background: rgba(217, 138, 11, .13); color: var(--wait); font-size: 12.5px; line-height: 1.5;
              padding: 8px 12px; display: flex; align-items: center; gap: 7px; }
  .wx-guide svg.ic { flex: none; font-size: 15px; }
  .wx-guide .close { margin-left: auto; border: none; background: none; color: inherit; font-size: 15px;
                     cursor: pointer; padding: 0 2px; flex: none; }

  footer { background: var(--card); border-top: 1px solid var(--line);
           padding: 9px 12px; padding-bottom: max(9px, env(safe-area-inset-bottom));
           display: flex; gap: 9px; align-items: center; }
  .round-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--card-2);
               color: var(--muted); flex: none; cursor: pointer;
               display: flex; align-items: center; justify-content: center; transition: transform .12s; }
  .round-btn:active { transform: scale(.9); }
  .round-btn svg.ic { font-size: 21px; }
  .round-btn.accent { background: linear-gradient(135deg, var(--brand1), var(--brand2)); color: #fff;
                      box-shadow: 0 4px 10px rgba(47, 107, 255, .30); }
  .round-btn.accent svg.ic { font-size: 18px; }
  .round-btn.accent:disabled { opacity: .45; box-shadow: none; }
  #text-in { flex: 1; border: none; background: var(--card-2); border-radius: 21px; padding: 11px 17px;
             font-size: 15px; color: var(--text); outline: none; }
  #text-in::placeholder { color: var(--muted); }
</style>
</head>
<body>

<!-- 连接中 -->
<div id="page-connecting" class="page">
  <div class="gate">
    <div class="gate-inner">
    <div class="brand-hero">
      <svg class="envelope" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#4f8cff"/>
          </linearGradient>
        </defs>
        <path d="M20 12c-5 0-9 4-9 9 0 3 1.4 5.6 3.6 7.2C10.5 29.6 8 33 8 37c0 5.5 4.5 10 10 10h28c6.6 0 12-5.4 12-12s-5.4-12-12-12c-.8 0-1.6.1-2.4.3C42.2 17.7 37 12.6 30.6 12.6c-2 0-4 .5-5.6 1.4C23.6 13 22 12 20 12Z" fill="url(#lg1)" opacity=".16"/>
        <rect x="16" y="38" width="64" height="42" rx="9" fill="url(#lg1)" opacity=".14"/>
        <rect x="16" y="38" width="64" height="42" rx="9" stroke="url(#lg1)" stroke-width="3.5"/>
        <path d="M18 42l28 20a6 6 0 0 0 7 0l27-20" stroke="url(#lg1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34 18h18M28 26h28" stroke="#8fb3ff" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
      </svg>
      <h1>云书</h1>
      <p>局域网极速互传</p>
    </div>
    <div class="big-spin"></div>
    <p class="hint" id="conn-text">正在连接电脑…</p>
    <button class="primary hidden" id="btn-reload" style="max-width: 220px" onclick="location.reload()">重新扫码</button>
    </div>
  </div>
</div>

<!-- 配对 -->
<div id="page-pairing" class="page">
  <div class="gate">
    <div class="gate-inner">
    <div class="brand-hero">
      <svg class="envelope" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#4f8cff"/>
          </linearGradient>
        </defs>
        <rect x="16" y="34" width="64" height="42" rx="9" fill="url(#lg2)" opacity=".14"/>
        <rect x="16" y="34" width="64" height="42" rx="9" stroke="url(#lg2)" stroke-width="3.5"/>
        <path d="M18 38l28 20a6 6 0 0 0 7 0l27-20" stroke="url(#lg2)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="76" cy="26" r="9" fill="#23a55a" opacity=".18"/>
        <path d="M72 26l3 3 5.5-6" stroke="#23a55a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>云书</h1>
      <p>输入电脑上显示的 6 位配对码</p>
    </div>

    <div class="gate-card">
      <form id="pair-form">
        <div class="otp" id="otp">
          <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="第 1 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 2 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 3 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 4 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 5 位">
          <input inputmode="numeric" maxlength="1" aria-label="第 6 位">
        </div>
        <p class="code-note">配对码 60 秒内有效，超时会自动刷新</p>

        <label class="field-label" for="device-name">手机名称</label>
        <input class="field" id="device-name" maxlength="20" placeholder="设备名称" autocomplete="off">

        <button class="primary" id="btn-pair" type="submit">
          <span id="pair-btn-text">确认配对</span>
        </button>
        <p class="form-err" id="pair-err" role="alert"></p>
      </form>
      <div class="peer-line"><span class="dot"></span>已发现电脑 · <span id="pair-host"></span></div>
      <div class="safe-note">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
        局域网直连，数据不经任何服务器
      </div>
    </div>
    </div>
  </div>
</div>

<!-- 主界面：聊天时间线 -->
<div id="page-main" class="page hidden">
  <header>
    <div class="avatar" id="pc-avatar">云</div>
    <div class="meta">
      <b id="pc-name">电脑</b>
      <span id="pc-status"><i class="dot"></i>连接中…</span>
    </div>
  </header>
  <div id="wechat-guide" class="wx-guide hidden">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    <span>微信内无法下载文件：点右上角「···」→「在浏览器打开」后再操作</span>
    <button class="close" aria-label="关闭" onclick="this.parentElement.classList.add('hidden')">✕</button>
  </div>
  <div id="chat"></div>
  <footer>
    <button class="round-btn" id="btn-file" aria-label="发送文件" title="发送文件">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <input id="text-in" placeholder="发送消息…" autocomplete="off">
    <button class="round-btn accent" id="btn-send" aria-label="发送" title="发送" disabled>
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5c.9-.4.9-1.6 0-2L3.4 3.4c-.7-.3-1.5.3-1.3 1.1L3.9 10c.1.4.5.7.9.8l7.7 1.1-7.7 1.1c-.4.1-.8.4-.9.8l-1.8 5.5c-.2.8.6 1.4 1.3 1.1z"/></svg>
    </button>
  </footer>
</div>

<input type="file" id="file-input" multiple hidden>

<script>
const $ = id => document.getElementById(id);
let ws = null, paired = false, retryTimer = null, tokenDead = false;
let session = '';
let httpPort = '';
const IS_WECHAT = /MicroMessenger/i.test(navigator.userAgent);
function showWeChatGuide() {
  if (!IS_WECHAT) return;
  $('wechat-guide').classList.remove('hidden');
}
try { session = sessionStorage.getItem('ys-session') || ''; } catch (_) {}
const token = new URLSearchParams(location.search).get('t') || '';
let pcName = '电脑';

function storeSession(v) { try { sessionStorage.setItem('ys-session', v); } catch (_) {} }
function storeDevice(v) { try { localStorage.setItem('ys-device', v); } catch (_) {} }

function deviceName() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad/i.test(ua)) return 'iPhone';
  if (/Android/i.test(ua)) return 'Android 手机';
  if (/HarmonyOS/i.test(ua)) return '鸿蒙手机';
  return '手机浏览器';
}
try { $('device-name').value = localStorage.getItem('ys-device') || deviceName(); }
catch (_) { $('device-name').value = deviceName(); }

function show(page) {
  for (const p of ['connecting', 'pairing', 'main'])
    $('page-' + p).classList.toggle('hidden', p !== page);
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function now() { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

/* ---------- 连接 ---------- */
function connect() {
  if (ws || tokenDead) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  try { ws = new WebSocket(proto + '://' + location.host + '/ws'); }
  catch (_) { ws = null; scheduleRetry(); return; }
  ws.onopen = () => {
    stopRetry();
    if (!paired) show('pairing');
    send({ type: 'hello', token: token, device: $('device-name').value.trim() || deviceName(), session: session });
  };
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (_) {} };
  ws.onclose = () => {
    ws = null;
    if (!paired) {
      show('connecting');
      $('conn-text').textContent = '连接断开，正在重连…';
    } else {
      // 配对态掉线（锁屏/切后台）：状态置灰并自动重连，重连时凭会话恢复，聊天记录保留
      setPcOnline(false);
    }
    scheduleRetry();
  };
  ws.onerror = () => {};
}
function scheduleRetry() {
  if (retryTimer || tokenDead) return;
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, 2000);
}
function stopRetry() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
}

function setPcOnline(online) {
  const s = $('pc-status');
  // 状态行重建：圆点独立元素 + textContent（不把 location.host 拼进 HTML）
  s.innerHTML = '';
  const dot = document.createElement('i');
  dot.className = 'dot';
  s.appendChild(dot);
  s.appendChild(document.createTextNode(online ? '在线 · ' + location.host : '已断开，等待重连'));
  s.classList.toggle('online', online);
}

function handle(m) {
  switch (m.type) {
    case 'pair_result':
      if (m.ok) {
        paired = true;
        session = m.session;
        storeSession(session);
        if (m.http_port && /^\d{1,5}$/.test(String(m.http_port))) httpPort = String(m.http_port);
        pcName = m.pc_name || '电脑';
        $('pc-name').textContent = pcName;
        $('pc-avatar').textContent = (pcName[0] || '云').toUpperCase();
        setPcOnline(true);
        show('main');
      } else {
        setPairBusy(false);
        // 恢复会话失败（电脑重启/被新配对顶替/主动断开过）：退回正常配对流程
        if (paired) { paired = false; setPcOnline(false); show('pairing'); }
        $('pair-err').textContent = m.reason || '配对失败';
        const otp = $('otp');
        otp.classList.add('shake');
        setTimeout(() => otp.classList.remove('shake'), 450);
        if ((m.reason || '').indexOf('过期') >= 0) {
          tokenDead = true;
          stopRetry();
          paired = false;
          show('connecting');
          $('conn-text').textContent = '二维码已过期，请重新扫码';
          $('btn-reload').classList.remove('hidden');
        } else if ((m.reason || '').indexOf('超时') >= 0) {
          $('pair-err').textContent = '配对码已超时，请输入电脑上新显示的配对码';
          clearOtp();
          send({ type: 'hello', token: token, device: $('device-name').value.trim() || deviceName() });
        } else {
          otp.classList.add('bad');
          setTimeout(() => { otp.classList.remove('bad'); clearOtp(); }, 500);
        }
      }
      break;
    case 'pc_text': addInText(m.text); break;
    case 'pc_file': addInFile(m); break;
    case 'progress': updateProgress(m); break;
  }
}

/* ---------- 配对码分格输入 ---------- */
const otpInputs = [...document.querySelectorAll('#otp input')];
function otpValue() { return otpInputs.map(i => i.value).join(''); }
function clearOtp() {
  otpInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
  otpInputs[0].focus();
}
otpInputs.forEach((inp, idx) => {
  inp.addEventListener('input', () => {
    const v = inp.value.replace(/\D/g, '');
    if (!v) { inp.value = ''; inp.classList.remove('filled'); return; }
    if (v.length > 1) {
      // iOS 短信验证码自动填充 / 输入法批量插入：整串分发到后续格子
      [...v].forEach((d, i) => {
        const cell = otpInputs[idx + i];
        if (cell) { cell.value = d; cell.classList.add('filled'); }
      });
      (otpInputs[Math.min(idx + v.length, 5)] || otpInputs[5]).focus();
      $('otp').classList.remove('bad');
      if (otpValue().length === 6) submitPair();
      return;
    }
    inp.value = v;
    inp.classList.add('filled');
    $('otp').classList.remove('bad');
    if (inp.value && idx < 5) otpInputs[idx + 1].focus();
    if (otpValue().length === 6) submitPair();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && idx > 0) otpInputs[idx - 1].focus();
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    if (!digits) return;
    [...digits].forEach((d, i) => {
      if (otpInputs[i]) { otpInputs[i].value = d; otpInputs[i].classList.add('filled'); }
    });
    (otpInputs[Math.min(digits.length, 5)] || otpInputs[5]).focus();
    if (digits.length === 6) submitPair();
  });
});

let pairingBusy = false;
function setPairBusy(busy) {
  pairingBusy = busy;
  $('btn-pair').disabled = busy;
  $('btn-pair').innerHTML = busy
    ? '<span class="spin"></span><span>正在配对…</span>'
    : '<span id="pair-btn-text">确认配对</span>';
}
function submitPair() {
  if (pairingBusy) return;
  const code = otpValue();
  if (!/^\d{6}$/.test(code)) return;
  const name = $('device-name').value.trim() || deviceName();
  storeDevice(name);
  $('pair-err').textContent = '';
  setPairBusy(true);
  send({ type: 'pair', code: code });
}
$('pair-form').addEventListener('submit', e => {
  e.preventDefault();
  if (otpValue().length !== 6) { $('pair-err').textContent = '请输入完整的 6 位数字配对码'; return; }
  submitPair();
});
$('device-name').onchange = () => {
  const name = $('device-name').value.trim() || deviceName();
  storeDevice(name);
  send({ type: 'hello', token: token, device: name });
};

/* ---------- 时间线渲染 ---------- */
function el(tag, cls, text) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text != null) d.textContent = text;
  return d;
}
let lastMeta = { dir: '', time: '' };
function addMeta(dir, label) {
  const t = label.match(/\d{2}:\d{2}/) ? label.slice(-5) : '';
  const same = dir === lastMeta.dir && t === lastMeta.time && t !== '';
  lastMeta = { dir, time: t };
  if (same) return;
  $('chat').appendChild(el('div', 'ts', label));
}
function scrollBottom() { requestAnimationFrame(() => { $('chat').scrollTop = $('chat').scrollHeight; }); }

function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const kind =
    /^(png|jpe?g|gif|webp|heic|heif|bmp|svg|tiff?|avif)$/.test(ext) ? ['var(--wait)', 'M4 5h16v14H4zM8 11l3 3 2.5-3 3.5 4H6z M8.5 8.5a1 1 0 1 0 0-.01'] :
    /^(zip|rar|7z|tar|gz|bz2|xz)$/.test(ext) ? ['#8e6cf0', 'M7 4h10v16l-2.5-2L12 20l-2.5-2L7 20zM10 9h4'] :
    /^(mp3|wav|flac|aac|ogg|m4a)$/.test(ext) ? ['#12b5cb', 'M9 18V6l10-2v12 M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'] :
    /^(mp4|mov|mkv|avi|webm|m4v)$/.test(ext) ? ['#f05f8c', 'M4 5h16v14H4z M10 9l6 3-6 3z'] :
    ['var(--brand1)', 'M6 3h8l4 4v14H6z M14 3v4h4'];
  return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="${kind[0]}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${kind[1]}"/></svg>`;
}
function makeFileIcon(name) {
  const wrap = el('div', 'file-ic');
  wrap.style.background = 'linear-gradient(135deg, var(--brand1), var(--brand2))';
  wrap.innerHTML = fileIcon(name);
  return wrap;
}
async function copyText(text, act) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  if (act) { act.textContent = ''; act.insertAdjacentHTML('beforeend', okSvg + ' 已复制'); setTimeout(() => { act.innerHTML = copySvg + ' 复制到剪贴板'; }, 1600); }
}
const copySvg = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const dlSvg = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>';
const okSvg = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

function addInText(text) {
  addMeta('left', pcName + ' ' + now());
  const row = el('div', 'row');
  const card = el('div', 'card');
  const body = el('div', null, text);
  body.style.cssText = 'font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap';
  body.ondblclick = () => copyText(text);
  const act = el('div', 'act');
  act.innerHTML = copySvg + ' 复制到剪贴板';
  act.onclick = () => copyText(text, act);
  card.append(body, act);
  row.appendChild(card);
  $('chat').appendChild(row);
  scrollBottom();
}
function addOutText(text) {
  addMeta('right', '我 ' + now());
  const row = el('div', 'row right');
  row.appendChild(el('div', 'bubble mine', text));
  $('chat').appendChild(row);
  scrollBottom();
}
function fileCard(name, size, mine) {
  const card = el('div', 'card' + (mine ? ' mine' : ''));
  const tr = el('div', 'title-row');
  tr.appendChild(makeFileIcon(name));
  const tw = el('div', 'tw');
  tw.appendChild(el('b', null, name));
  tw.appendChild(el('div', 'sub', mine ? `→ ${pcName} · ${fmtSize(size)}` : fmtSize(size)));
  tr.appendChild(tw);
  card.appendChild(tr);
  return card;
}
function addOutFile(name, size) {
  addMeta('right', '我 ' + now());
  const row = el('div', 'row right');
  const card = fileCard(name, size, true);
  const badge = el('span', 'badge run', '传输中');
  card.querySelector('.title-row').appendChild(badge);
  const bar = el('i');
  const p = el('div', 'progress');
  p.appendChild(bar);
  const pct = el('span', 'pct', '0%');
  const prow = el('div', 'progress-row');
  prow.append(p, pct);
  card.appendChild(prow);
  row.appendChild(card);
  $('chat').appendChild(row);
  scrollBottom();
  return {
    setProgress: (loaded, total) => {
      const r = total ? loaded / total : 0;
      bar.style.width = r * 100 + '%';
      pct.textContent = Math.round(r * 100) + '%';
    },
    setStatus: (t, cls) => { badge.textContent = t; badge.className = 'badge ' + cls; prow.remove(); }
  };
}
function addInFile(m) {
  addMeta('left', pcName + ' ' + now());
  const row = el('div', 'row');
  const card = fileCard(m.name, m.size, false);
  // 文件 id 即下载凭证（服务端不校验 session），不把会话凭证暴露进 URL/浏览器历史；
  // id 经 encodeURIComponent 编码后再拼路径（纵深防御，服务端 id 本为 uuid hex）
  const fid = encodeURIComponent(m.id);
  const sameOrigin = '/file/' + fid;
  const httpUrl = httpPort && String(httpPort) !== location.port
    ? 'http://' + location.hostname + ':' + httpPort + '/file/' + fid
    : '';
  // 主通道走 HTTP 直连：自签 HTTPS 下多数国产手机浏览器的下载管理器不继承页面的
  // 证书信任（响应头能到、body 0 字节或无反应），顶级导航到 HTTP 可完全绕开。
  // 跨域时 download 属性被忽略，但服务端的 Content-Disposition: attachment 仍会触发下载。
  function fileLink(url, label) {
    const a = el('a', 'act');
    a.innerHTML = dlSvg + label;
    a.href = url;
    a.setAttribute('download', m.name);
    a.style.textDecoration = 'none';
    if (IS_WECHAT) a.addEventListener('click', e => { e.preventDefault(); showWeChatGuide(); });
    return a;
  }
  if (httpUrl) {
    card.appendChild(fileLink(httpUrl, ' 下载到手机'));
    card.appendChild(fileLink(sameOrigin, ' 本页直连下载（备用）'));
  } else {
    card.appendChild(fileLink(sameOrigin, ' 下载到手机'));
  }
  if (IS_WECHAT) showWeChatGuide();
  row.appendChild(card);
  $('chat').appendChild(row);
  scrollBottom();
}
function updateProgress(m) {
  const bar = document.getElementById('pb-' + m.id);
  if (bar) bar.style.width = (m.size ? m.transferred / m.size * 100 : 0) + '%';
}

/* ---------- 发送 ---------- */
const sendBtn = $('btn-send'), textIn = $('text-in');
textIn.addEventListener('input', () => { sendBtn.disabled = !textIn.value.trim(); });
sendBtn.onclick = sendText;
textIn.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
function sendText() {
  const text = textIn.value.trim();
  if (!text) return;
  send({ type: 'send_text', text: text });
  addOutText(text);
  textIn.value = '';
  sendBtn.disabled = true;
}
$('btn-file').onclick = () => $('file-input').click();
$('file-input').onchange = () => {
  for (const f of [...$('file-input').files]) uploadFile(f);
  $('file-input').value = '';
};
function uploadFile(f) {
  const fd = new FormData();
  fd.append('file', f);
  const xhr = new XMLHttpRequest();
  const card = addOutFile(f.name, f.size);
  xhr.open('POST', '/upload');
  xhr.setRequestHeader('X-Yunshu-Session', session);
  xhr.upload.onprogress = e => card.setProgress(e.loaded, e.total);
  xhr.onload = () => {
    card.setProgress(1, 1);
    if (xhr.status === 200) card.setStatus('已发送', 'done');
    else {
      let msg = '失败';
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
      card.setStatus(msg, 'err');
    }
  };
  xhr.onerror = () => card.setStatus('失败', 'err');
  xhr.send(fd);
}

$('pair-host').textContent = location.host;
connect();
</script>
</body>
