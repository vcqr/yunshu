[package]
name = "yunshu-core"
version.workspace = true
edition.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
dirs = "7.0.0"
futures-util = "0.3.34"
if-addrs = "0.15.0"
rand = "0.10.3"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
toml = "1.1.8"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
rcgen = "0.14.10"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
sha2 = "0.11.1"
enigo = "0.6"
xcap = "0.9"
jpeg-encoder = "0.7"
pbkdf2 = "0.13"
openh264 = { version = "0.9.9", features = ["source"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
